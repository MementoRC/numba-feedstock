name: RC version bump check

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE: numba
  REPO: MementoRC/numba-feedstock
  RC_BRANCH: rc

jobs:
  check-and-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Verify ${{ env.RC_BRANCH }} branch exists on ${{ env.REPO }}
        run: |
          if ! git ls-remote --exit-code --heads \
               "https://github.com/${REPO}.git" "$RC_BRANCH" >/dev/null 2>&1; then
            echo "::error::Branch '${RC_BRANCH}' does not exist on ${REPO}."
            echo "::error::Seed it from the conda-forge rc track, e.g.:"
            echo "::error::  git push origin upstream/rc:refs/heads/${RC_BRANCH}"
            exit 1
          fi
          echo "Found ${REPO}@${RC_BRANCH}"

      - name: Checkout default branch (for the bump script)
        uses: actions/checkout@v4

      - name: Checkout the ${{ env.RC_BRANCH }} branch (recipe to bump)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RC_BRANCH }}
          path: rc
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packaging
        run: python3 -m pip install --upgrade packaging

      - name: Check PyPI for a newer ${{ env.PACKAGE }} prerelease
        id: bump
        run: python3 .github/scripts/bump_rc.py rc/recipe/recipe.yaml --package "$PACKAGE"

      - name: Open PR into ${{ env.REPO }}:${{ env.RC_BRANCH }}
        if: steps.bump.outputs.changed == 'true'
        working-directory: rc
        env:
          GH_TOKEN: ${{ secrets.CF_FEEDSTOCK_PAT }}
        run: |
          git config user.name "rc-bump-bot"
          git config user.email "actions@users.noreply.github.com"
          BRANCH="rc-bump/${{ steps.bump.outputs.new_version }}"
          git checkout -b "$BRANCH"
          git commit -am "${PACKAGE} rc: bump ${{ steps.bump.outputs.old_version }} -> ${{ steps.bump.outputs.new_version }}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push origin "$BRANCH" --force
          gh pr create \
            --repo "$REPO" \
            --base "$RC_BRANCH" \
            --head "$BRANCH" \
            --title "[rc] ${PACKAGE}: ${{ steps.bump.outputs.old_version }} -> ${{ steps.bump.outputs.new_version }}" \
            --body "Automated ${PACKAGE} release-candidate bump.

          - version: ${{ steps.bump.outputs.old_version }} -> ${{ steps.bump.outputs.new_version }}
          - sdist: ${{ steps.bump.outputs.tarball_url }}
          - sha256: ${{ steps.bump.outputs.sha256 }}

          Auto-generated by .github/workflows/rc-bump.yml on ${REPO}'s default branch. Diff scoped to recipe/recipe.yaml only." || echo "PR create skipped (may already exist)"
