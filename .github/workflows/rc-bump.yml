name: RC version bump check

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Resolve and print the diff, but do not push or open a PR'
        type: boolean
        default: false

permissions:
  contents: read

env:
  PACKAGE: numba
  REPO: MementoRC/numba-feedstock
  UPSTREAM: conda-forge/numba-feedstock
  RC_BRANCH: rc

jobs:
  check-and-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Verify ${{ env.RC_BRANCH }} branch exists on ${{ env.UPSTREAM }}
        run: |
          # The bump is cut from upstream/rc, so that is the ref that must
          # exist. The fork's own rc branch is no longer used by this workflow.
          if ! git ls-remote --exit-code --heads \
               "https://github.com/${UPSTREAM}.git" "$RC_BRANCH" >/dev/null 2>&1; then
            echo "::error::Branch '${RC_BRANCH}' does not exist on ${UPSTREAM}."
            echo "::error::The conda-forge rc track is missing; nothing to bump."
            exit 1
          fi
          echo "Found ${UPSTREAM}@${RC_BRANCH}"

      - name: Checkout default branch (for the bump script)
        uses: actions/checkout@v4
        with:
          path: scaffold

      - name: Checkout the fork (working tree for the bump)
        uses: actions/checkout@v4
        with:
          path: rc
          fetch-depth: 0
          persist-credentials: false

      # The fork's own rc ref can lag upstream (e.g. between sync PRs), so the
      # recipe being bumped always comes from upstream/rc, not the fork's rc.
      - name: Fetch upstream and pin the working tree to upstream/${{ env.RC_BRANCH }}
        working-directory: rc
        run: |
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream "$RC_BRANCH" --no-tags
          git checkout -B "$RC_BRANCH" "upstream/${RC_BRANCH}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packaging
        run: python3 -m pip install --upgrade packaging

      - name: Check PyPI for a newer ${{ env.PACKAGE }} prerelease
        id: bump
        run: python3 "${GITHUB_WORKSPACE}/scaffold/.github/scripts/bump_rc.py" rc/recipe/recipe.yaml --package "$PACKAGE"

      - name: Dry run - show what would change
        if: steps.bump.outputs.changed == 'true' && inputs.dry_run
        working-directory: rc
        run: |
          git diff

      - name: Push branch and open PR against ${{ env.UPSTREAM }}:${{ env.RC_BRANCH }}
        if: steps.bump.outputs.changed == 'true' && !inputs.dry_run
        working-directory: rc
        env:
          GH_TOKEN: ${{ secrets.CF_FEEDSTOCK_PAT }}
          OLD_VERSION: ${{ steps.bump.outputs.old_version }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          TARBALL_URL: ${{ steps.bump.outputs.tarball_url }}
          SHA256: ${{ steps.bump.outputs.sha256 }}
        run: |
          git config user.name "rc-bump-bot"
          git config user.email "actions@users.noreply.github.com"
          BRANCH="rc-bump/${NEW_VERSION}"
          OWNER="${REPO%%/*}"
          git checkout -b "$BRANCH"
          git commit -am "${PACKAGE} rc: bump ${OLD_VERSION} -> ${NEW_VERSION}"

          # The remote is named upstream (it points at conda-forge for fetch),
          # but its push URL is the fork: the bump branch only ever lives on
          # the fork, the PR just targets upstream's rc branch as its base.
          git remote set-url --push upstream "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push --force upstream "HEAD:refs/heads/${BRANCH}"

          cat "${GITHUB_WORKSPACE}/scaffold/.github/rc-pr-body-header.md" > "${RUNNER_TEMP}/pr-body.md"
          {
            printf '\n'
            printf 'Automated %s release-candidate bump.\n\n' "$PACKAGE"
            printf -- '- version: %s -> %s\n' "$OLD_VERSION" "$NEW_VERSION"
            printf -- '- build_number: reset to 0 (version changed)\n'
            printf -- '- sdist: %s\n' "$TARBALL_URL"
            printf -- '- sha256: %s\n' "$SHA256"
            printf '\nThe head branch lives only on `%s`; nothing is created on `%s`.\n' "$REPO" "$UPSTREAM"
          } >> "${RUNNER_TEMP}/pr-body.md"

          gh pr create \
            --repo "$UPSTREAM" \
            --base "$RC_BRANCH" \
            --head "${OWNER}:${BRANCH}" \
            --title "[rc] ${PACKAGE}: ${OLD_VERSION} -> ${NEW_VERSION}" \
            --body-file "${RUNNER_TEMP}/pr-body.md" \
            || echo "PR create skipped (may already exist)"
