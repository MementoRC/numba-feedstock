context:
  build_number: 0
  name: numba
  version: 0.67.0rc1
  sha256: 36d3f50cbb992a4c40a53f070eb04ae774d8be5c0c733994307f65e134112e3e
  fast_tests: "1"
  ppc64le_on_aarch64: ${{ target_platform == "linux-ppc64le" and build_platform == "linux-aarch64" }}
  is_ppc64le: ${{ target_platform == "linux-ppc64le" }}

package:
  name: numba
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  patches:
    - patches/0001-ppc64le-abi-workaround-ldexp-frexp.patch
    - patches/0002-configurable-random-test-seed.patch
    # test_unique segfaults only under ppc64le QEMU emulation; believed to be
    # a QEMU/numba-JIT-execution-path issue, not a genuine LLVM codegen
    # defect (clean #6606 signature check + clean AOT/no-JIT differential
    # repro) -- see conda-forge/numba-feedstock#192.
    - if: is_ppc64le
      then:
        - patches/0003-skip-test_unique-on-ppc64le.patch

build:
  number: ${{ build_number }}
  skip: match(python, "<3.10")
  script:
    - if: linux
      then: export CC="${CC} -pthread"
    - if: linux
      then: export CXX="${CXX} -pthread"
    - ${{ PYTHON }} -m pip install . --no-deps --ignore-installed -vvv
  python:
    entry_points:
      - numba = numba.misc.numba_entry:main

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy >=1.24,<2.5
    # llvm is needed for the headers
    - if: osx
      then: llvm-openmp
    - if: linux
      then: libgomp
  host:
    - pip
    - python
    - llvmlite 0.49.*
    - numpy >=1.24,<2.5
    - setuptools
    - tbb-devel
  run:
    - ${{ pin_compatible('llvmlite', upper_bound='x.x') }}
    - python
    - numpy >=1.22.3,<2.5
  ignore_run_exports:
    by_name:
      - tbb
  run_constraints:
    - ${{ pin_compatible('tbb', upper_bound=None) }}
    - if: x86_64
      then: libopenblas !=0.3.6
    - if: arm64
      then: libopenblas >=0.3.18,!=0.3.20
    - cuda-version >=11.2
    - cudatoolkit >=11.2
    - scipy >=1.0
    - cuda-python >=11.6

tests:
  - if: not ppc64le_on_aarch64
    then:
      - python:
          imports:
            - numba
            - numba.core.annotations
            - numba.core.datamodel
            - numba.core.rewrites
            - numba.core.runtime
            - numba.core.typeconv
            - numba.core.typing
            - numba.core.unsafe
            - numba.cuda
            - numba.cuda.cudadrv
            - numba.cuda.kernels
            - numba.cuda.simulator
            - numba.cuda.simulator.cudadrv
            - numba.cuda.tests
            - numba.cuda.tests.cudadrv
            - numba.cuda.tests.cudapy
            - numba.cuda.tests.cudasim
            - numba.cuda.tests.nocuda
            - numba.experimental.jitclass
            - numba.np.ufunc
            - numba.scripts
            - numba.testing
            - numba.tests
            - numba.tests.npyufunc
          pip_check: true

  - script:
      content:
        - if: not ppc64le_on_aarch64
          then:
            - numba -h
            - numba -s

  - script:
      content:
        - if: unix
          then:
            - export CROSSCOMPILING_EMULATOR=${QEMU_EXECVE:-""}
            - export QEMU_EXECVE=${QEMU_EXECVE:-""}
            - export QEMU_LD_PREFIX=${CONDA_BUILD_SYSROOT}
        - ${{ "bash run_test.sh" if unix else "cmd /c run_test.bat" }}
      env:
        FAST_TESTS: ${{ "1" if not unix else "0" if build_number == 0 else fast_tests }}  # non-unix verified to be long run failure to clean-up
        build_platform: ${{ build_platform }}
        target_platform: ${{ target_platform }}
        flow_run_id: ${{ env.get("flow_run_id", default="0") }}
    files:
      recipe:
        # On non-unix, rattler-build (Issue 2657 upstream), fails to clean large testsuite
        # Use multiple CI rerun or FAST_TEST: 1
        - run_test.${{ "sh" if unix else "bat" }}
    requirements:
      build:
        - if: ppc64le_on_aarch64
          then:
            - qemu-execve-ppc64le
      run:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - pip
        - python
        - jinja2
        - cffi
        - scipy
        - if: linux and x86_64
          then:
            - numpy !=1.26.0
        - ipython
        - setuptools
        - tbb

about:
  license: BSD-2-Clause
  license_file: LICENSE
  summary: NumPy aware dynamic Python compiler using LLVM
  description: |
    Numba is an Open Source NumPy-aware optimizing compiler for Python
    sponsored by Anaconda, Inc. It uses the remarkable LLVM compiler
    infrastructure to compile Python syntax to machine code."
  homepage: http://numba.pydata.org
  repository: https://github.com/numba/numba
  documentation: http://numba.pydata.org/

extra:
  recipe-maintainers:
    - souravsingh
    - marcelotrevisani
    - henryiii
    - mbargull
    - jakirkham
    - step21
    - esc
    - MementoRC
    
